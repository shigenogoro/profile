    <!-- Set theme before paint to avoid a flash of the wrong theme -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme')
          var dark = stored ? stored === 'dark' : true
          document.documentElement.classList.toggle('dark', dark)
        } catch (e) {}
      })()
    </script>
